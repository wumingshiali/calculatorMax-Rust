name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast checks for iteration: skip GUI feature to save compile time
  fast-check:
    name: Fast check (no GUI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          autocrlf: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install sccache
        uses: mozilla/sccache-action@v0.0.4
        with:
          version: "v0.7.4"

      - name: Probe sccache and set wrapper
        shell: bash
        run: |
          set -e
          if sccache --version >/dev/null 2>&1 && sccache --show-stats >/dev/null 2>&1; then
            echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          else
            echo "RUSTC_WRAPPER=" >> $GITHUB_ENV
            echo "SCCACHE_NO_DAEMON=1" >> $GITHUB_ENV
            echo "sccache probe failed, disabling sccache for build."
          fi

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-fast
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/sccache
          key: ${{ runner.os }}-sccache-${{ hashFiles('**/Cargo.lock') }}-fast
          restore-keys: |
            ${{ runner.os }}-sccache-

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Fast build and tests (no GUI)
        run: |
          cargo check --no-default-features --all-targets --all-features --verbose
          cargo test --no-default-features --verbose

  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v4
      with:
        autocrlf: false
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        # 如果是 macOS，确保同时安装 Intel 和 Apple Silicon 的目标架构以生成通用二进制
        targets: ${{ matrix.os == 'macos-latest' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}
        
    - name: Install sccache
      uses: mozilla/sccache-action@v0.0.4
      with:
        version: "v0.7.4"
        
    - name: Probe sccache and set wrapper
      shell: bash
      run: |
        set -e
        if sccache --version >/dev/null 2>&1 && sccache --show-stats >/dev/null 2>&1; then
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
        else
          echo "RUSTC_WRAPPER=" >> $GITHUB_ENV
          echo "SCCACHE_NO_DAEMON=1" >> $GITHUB_ENV
          echo "sccache probe failed, disabling sccache for build."
        fi

    - name: Cache Cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
          
    - name: Cache sccache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/sccache
        key: ${{ runner.os }}-sccache-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-sccache-
        
    # Windows 和 Linux 依旧保持原有的普通编译流程
    - name: Build release (Non-macOS)
      if: matrix.os != 'macos-latest'
      run: cargo build --release --verbose

    # macOS 编译与打包：换回 100% 稳定的本地安装，避免 DNS 域名解析报错影响构建
    - name: Bundle macOS App (Universal)
      if: matrix.os == 'macos-latest'
      run: |
        cargo install cargo-bundle
        # 使用 -t 同时指定两个架构，自动用 lipo 融合成 Universal 架构并生成 .app
        cargo bundle --release -t aarch64-apple-darwin -t x86_64-apple-darwin

    # 【核心保留】：通过 find 动态寻找生成的 calculator-max.app 路径并打包，解决目录不确定问题
    - name: Package macOS artifact
      if: matrix.os == 'macos-latest'
      run: |
        # 寻找 calculator-max.app 所在的绝对路径
        APP_PATH=$(find target -type d -name "calculator-max.app" | head -n 1)
        if [ -z "$APP_PATH" ]; then
          echo "Error: calculator-max.app not found!"
          exit 1
        fi
        echo "Found app at: $APP_PATH"
        # 进入该目录的上一级，执行压缩
        cd "$(dirname "$APP_PATH")"
        zip -r "../../../../calculator-max-macos.zip" calculator-max.app
        # 将生成的压缩包移动到当前工作流根目录以便后续上传
        mv "../../../../calculator-max-macos.zip" "$GITHUB_WORKSPACE/"

    # === 上传产物 ===
    # Linux / Windows 依旧保持原样上传
    - name: Upload Linux/Windows artifact
      if: matrix.os != 'macos-latest'
      uses: actions/upload-artifact@v7
      with:
        name: calculator-max-${{ matrix.os }}
        path: |
          target/release/calculator-max${{ matrix.os == 'windows-latest' && '.exe' || '' }}

    # macOS 直接上传根目录下完美打包好的真实 zip 包
    - name: Upload macOS artifact
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v7
      with:
        name: calculator-max-macos
        path: calculator-max-macos.zip
