name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast checks for iteration: skip GUI feature to save compile time
  fast-check:
    name: Fast check (no GUI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          autocrlf: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install sccache
        uses: mozilla/sccache-action@v0.0.4
        with:
          version: "v0.7.4"

      - name: Probe sccache and set wrapper
        shell: bash
        run: |
          set -e
          if sccache --version >/dev/null 2>&1 && sccache --show-stats >/dev/null 2>&1; then
            echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          else
            echo "RUSTC_WRAPPER=" >> $GITHUB_ENV
            echo "SCCACHE_NO_DAEMON=1" >> $GITHUB_ENV
            echo "sccache probe failed, disabling sccache for build."
          fi

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-fast
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/sccache
          key: ${{ runner.os }}-sccache-${{ hashFiles('**/Cargo.lock') }}-fast
          restore-keys: |
            ${{ runner.os }}-sccache-

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Fast build and tests (no GUI)
        run: |
          cargo check --no-default-features --all-targets --all-features --verbose
          cargo test --no-default-features --verbose

  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v4
      with:
        autocrlf: false
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        # 如果是 macOS，同时安装 Intel 和 Apple Silicon 的目标架构
        targets: ${{ matrix.os == 'macos-latest' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}
        
    - name: Install sccache
      uses: mozilla/sccache-action@v0.0.4
      with:
        version: "v0.7.4"
        
    - name: Probe sccache and set wrapper
      shell: bash
      run: |
        set -e
        if sccache --version >/dev/null 2>&1 && sccache --show-stats >/dev/null 2>&1; then
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
        else
          echo "RUSTC_WRAPPER=" >> $GITHUB_ENV
          echo "SCCACHE_NO_DAEMON=1" >> $GITHUB_ENV
          echo "sccache probe failed, disabling sccache for build."
        fi

    - name: Cache Cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
          
    - name: Cache sccache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/sccache
        key: ${{ runner.os }}-sccache-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-sccache-
        
    # Windows 和 Linux 依旧保持原有的普通编译流程
    - name: Build release (Non-macOS)
      if: matrix.os != 'macos-latest'
      run: cargo build --release --verbose

    # macOS 编译通用二进制文件（合并 Intel 与 Apple 芯片架构）
    - name: Build release (macOS Universal)
      if: matrix.os == 'macos-latest'
      run: |
        cargo build --release --target aarch64-apple-darwin --verbose
        cargo build --release --target x86_64-apple-darwin --verbose
        mkdir -p target/release
        lipo -create target/aarch64-apple-darwin/release/calculator-max target/x86_64-apple-darwin/release/calculator-max -output target/release/calculator-max

    # 依旧使用你原本的方案：通过 cargo-bundle 打包成 macOS 专属的 .app 结构
    - name: Bundle macOS App
      if: matrix.os == 'macos-latest'
      run: |
        cargo install cargo-bundle
        cargo bundle --release

    # 【修复的核心步骤】：打包真正完整的 .app，并输出至根目录，去除了原本多余且会覆盖文件的第二次打包
    - name: Package macOS artifact
      if: matrix.os == 'macos-latest'
      run: |
        cd target/bundle/osx
        zip -r ../../../calculator-max-macos.zip calculator-max.app

    # === 上传产物 ===
    # Linux / Windows 依旧保持原样上传
    - name: Upload Linux/Windows artifact
      if: matrix.os != 'macos-latest'
      uses: actions/upload-artifact@v7
      with:
        name: calculator-max-${{ matrix.os }}
        path: |
          target/release/calculator-max${{ matrix.os == 'windows-latest' && '.exe' || '' }}

    # macOS 修正了上传路径，直接上传根目录下完整生成的 zip 包
    - name: Upload macOS artifact
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v7
      with:
        name: calculator-max-macos
        path: calculator-max-macos.zip
